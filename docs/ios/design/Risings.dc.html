<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unknown birth time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Syne:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#030303}
a{color:#d9d4cc}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #030303; color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; padding: 76px 20px 30px; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 4px">
<span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.22em; color: #8f8f8f">NO BIRTH TIME · NO PROBLEM</span>
<h1 style="margin: 0; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 40px; line-height: 0.92; letter-spacing: -0.035em; text-transform: uppercase">We roasted both. Pick the one that <span style="color: {{ember}}">hurt.</span></h1>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #a8a8a8">Your Sun and Moon are certain. Your rising sign depends on the time, so here are both suspects.</p>
</div>
<sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="width: 100%; text-align: left; border-radius: 20px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: #e5e5e5; font: inherit; padding: 16px; display: flex; flex-direction: column; gap: 8px; transition: border-color 250ms, background 250ms">
<span style="display: flex; justify-content: space-between; width: 100%"><span style="font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px">{{c.sign}} rising</span><span style="font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #8f8f8f; padding-top: 4px">{{c.when}}</span></span>
<span style="font-size: 15px; line-height: 1.5; color: #c4c4c4">{{c.roast}}</span>
<span style="font-size: 13px; color: {{c.markColor}}">{{c.mark}}</span>
</button>
</sc-for>
<div style="flex-grow: 1"></div>
<a href="Teaser.dc.html" style="height: 54px; border-radius: 14px; background: #d9d4cc; color: #0a0a0a; text-decoration: none; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{cta}}</a>
<span style="text-align: center; font-size: 12px; color: #8f8f8f; line-height: 1.45">Not proof, just a strong hunch with jokes. Find your real time later and we’ll quietly fix everything.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ember":{"editor":"color","default":"#ff4a1c"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { pick: 0 };
  renderVals() {
    const ember = this.props.ember ?? '#ff4a1c';
    const opts = [
      { sign: 'Virgo', when: 'BEFORE ~11:20', roast: 'You walk into a room already editing it. People think you’re calm. You’re auditing.' },
      { sign: 'Libra', when: 'AFTER ~11:20', roast: 'You’re lovely to everyone and it takes you forty minutes to pick a table. Conflict gives you hives.' }
    ];
    const cards = opts.map((o, i) => {
      const on = i === this.state.pick;
      return { ...o, pressed: on ? 'true' : 'false', border: on ? '#d9d4cc' : '#1f1f1f', bg: on ? '#121212' : '#0b0b0b', mark: on ? 'This one hurt. Locked in.' : 'Tap if this one hurt more', markColor: on ? '#ff6a4a' : '#8f8f8f', pick: () => this.setState({ pick: i }) };
    });
    return { ember, cards, cta: 'Roast me as ' + opts[this.state.pick].sign + ' rising' };
  }
}
</script>
</body>
</html>
